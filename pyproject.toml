[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagenetog-redux"
version = "0.1.0"
description = "ImageNetOG Redux — read-only REST API for image collections on AWS"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools==2.43.1",
    "boto3==1.40.68",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.112.2",
    "moto[all]==5.1.22",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "bandit==1.7.10",
    "boto3-stubs[dynamodb,s3,s3vectors,bedrock-runtime,stepfunctions,events,cognito-idp]==1.40.69",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property"]
addopts = "--cov=src --cov-report=term-missing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# coverage.py
# ---------------------------------------------------------------------------
[tool.coverage.report]
# Lines matching any of these regexes are excluded from coverage measurement.
# The first entry restores coverage.py's default pragma (defining exclude_lines
# overrides the built-in default, so we must re-add it). The second is a
# project-specific, self-documenting marker for code that cannot be exercised
# by the unit/property suite because `moto` does not implement
# `s3vectors:QueryVectors` (see task 14.2). Prefer this explicit marker over a
# bare `# pragma: no cover` so every exclusion is intentional and greppable.
exclude_lines = [
    "pragma: no cover",
    "pragma: no cover - s3vectors QueryVectors unmockable",
]


# ---------------------------------------------------------------------------
# Hypothesis
# ---------------------------------------------------------------------------
[tool.hypothesis]
max_examples = 100
deriving = "best"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "C4", "PTH"]
ignore = ["S101"]  # allow assert in tests

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
mypy_path = "src"

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
level = "LOW"
confidence = "LOW"
recursive = true
