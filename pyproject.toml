[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "imagenetog-redux"
version = "0.1.0"
description = "ImageNetOG Redux — read-only REST API for image collections on AWS"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools==2.43.1",
    "boto3==1.34.155",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.112.2",
    "moto[all]==5.0.14",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "bandit==1.7.10",
    "boto3-stubs[dynamodb,s3,bedrock-runtime,stepfunctions,events,cognito-idp]==1.34.155",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property"]
addopts = "--cov=src --cov-report=term-missing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# Hypothesis
# ---------------------------------------------------------------------------
[tool.hypothesis]
max_examples = 100
deriving = "best"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "C4", "PTH"]
ignore = ["S101"]  # allow assert in tests

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
mypy_path = "src"

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
level = "LOW"
confidence = "LOW"
recursive = true
